spring:
  application:
    name: backend

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  servlet:
    context-path: /api
    max-swallow-size: -1
    connection-timeout: 20s
    keep-alive-timeout: 30s


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
