spring:
  application:
    name: backend

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  servlet:
    context-path: /api
    max-swallow-size: -1
    connection-timeout: 20s
    keep-alive-timeout: 30s


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  api:
    base-url: ${RATE_API_BASE_URL:https://open.er-api.com/v6}
    base-currency: USD
    # The endpoint answers in ~100-200 ms. 3 s to connect covers a slow DNS or
    # a cold TLS handshake; 10 s to read covers a slow-but-alive server while
    # still guaranteeing the call cannot hang forever.
    connect-timeout: 3s
    read-timeout: 10s

  schedule:
    # Off in tests (see application-test.yaml): a tick in @SpringBootTest would
    # call the real provider and write a row into the test database.
    enabled: ${RATE_SYNC_ENABLED:true}
    # Used when the provider's time_next_update_unix is missing or unusable.
    fallback-delay: ${RATE_SYNC_FALLBACK_DELAY:1h}
    # Floor: a timestamp in the past must not become a busy loop.
    min-delay: 1m
    # Ceiling: a nonsense far-future timestamp must not park the scheduler
    # for years. The provider updates daily, so 24h is already generous.
    max-delay: 24h

logging:
  level:
    root: INFO
